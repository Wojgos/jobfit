<header class="border-b border-slate-200 bg-white">
  <nav class="mx-auto flex max-w-6xl items-center gap-6 px-4 py-3" aria-label="Main">
    <a routerLink="/offers" class="text-lg font-bold tracking-tight text-slate-900">
      Job<span class="text-indigo-600">Fit</span>
    </a>
    <ul class="flex gap-1">
      @for (link of links; track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            routerLinkActive="bg-slate-100 text-slate-900"
            ariaCurrentWhenActive="page"
            class="rounded-md px-3 py-1.5 text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>
  </nav>
</header>

@if (meta.demoMode()) {
  <div class="bg-indigo-600 px-4 py-2 text-center text-sm text-white" role="status">
    Public demo with a sample CV — data resets every night, CV upload is disabled.
    <a href="https://github.com/Wojgos/jobfit" class="font-semibold underline">Source on GitHub</a>
  </div>
}

<main class="mx-auto max-w-6xl px-4 py-8">
  <router-outlet />
</main>
